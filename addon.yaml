# GitHub watch: one entry per repository. Reads its pull requests and Actions runs with GET calls only
# (Core's `gh` login, or a read-only token) and turns what changed into short lines for a team chat:
# PR opened / merged / closed and its CI result (pr_channel), each deploy workflow's result in its own
# channel (deploys), and every failure in one channel (alerts_channel). They go out through the add-on that
# provides chat_messages (Hisho's Discord add-on) only with post: true; until then they are journaled and
# listed on the page as "would post". It never writes to GitHub and never looks at what a deploy deploys to.
#   hisho addon entry github-watch app repo=owner/name pr_channel=pull-requests deploys="Deploy Dev=dev-testing"
name: github-watch
kind: integration
title: GitHub watch
description: A repository's pull requests, CI and deploy runs, as short posts in your team chat (read only on GitHub).
version: 0.2.0
you_need:
  - "A GitHub repository you can read (this machine's GitHub sign-in from Hisho's setup, or a read-only fine-grained token)"
  - "A chat add-on that provides `chat_messages` (the Discord add-on)"
provider: provider.py
requires: {capabilities: [chat_messages]}
entry_label: repository
secret_rotate: GitHub > Settings > Developer settings > Fine-grained tokens (read-only Pull requests, Actions, Metadata)
entry_schema:
  repo: str                  # owner/name
  token: "password?"         # a read-only token (pasted: a local secret) or its secret's NAME; empty = Core's `gh` sign-in (GET calls only)
  pr_channel: "str?"         # PR opened / merged / closed and CI passing on a PR
  ci_workflow: "str?"        # the CI workflow's name (default CI)
  deploys: "str?"            # deploy workflows and their channels: "Deploy Dev=dev-testing, Deploy Prod=prod-releases"
  alerts_channel: "str?"     # CI and deploy failures (also the deploy's own channel)
  post: "bool?"              # true = post; otherwise only journal and list them on the page (default false)
  chat_server: "str?"        # the chat add-on's entry, only when it has several
  note: "str?"
entry_form:
  repo: "Repository (owner/name)"
  token: "Read-only token (empty = this machine's GitHub sign-in)"
  pr_channel: "Channel for pull requests"
  ci_workflow: "CI workflow name (default CI)"
  deploys: "Deploy workflows = channel (comma-separated)"
  alerts_channel: "Channel for failures"
  post: "Post (true) or only list (false)"
  chat_server: "Chat server (only if several)"
  note: "Note"

help:
  repo:
    label: Repository
    say: "The repository to watch, written owner/name, like example-org/website. When this machine is signed in to GitHub, your repositories are listed above the form: press Use this on one."
  token:
    label: Read-only token
    say: "Leave it empty when this machine is signed in to GitHub (Hisho's setup wizard does that): Hisho uses that sign-in, reading only. Otherwise make a fine-grained token for only this repository, read-only: Pull requests, Actions and Metadata, and paste it here (or type the name of a secret you saved it under)."
    get: "https://github.com/settings/personal-access-tokens/new"
    get_label: Make a token on GitHub
  pr_channel:
    label: Pull request channel
    say: "The chat channel for pull requests opened, merged or closed, and their test results, like pull-requests."
  ci_workflow:
    label: CI workflow name
    say: "The name of the workflow that tests pull requests, as shown on the repository's Actions tab. Empty means CI."
  deploys:
    say: "Each deploy workflow and the channel for its results, separated by commas, like Deploy Dev=dev-testing, Deploy Prod=prod-releases."
  alerts_channel:
    label: Failures channel
    say: "The channel where every failed test or deploy is posted too."
  post:
    say: "On: Hisho posts to the chat. Off: it only lists what it would post on its page, so you can check first."
  chat_server:
    say: "Only if your chat add-on has more than one server: the name of the entry to post through."
  note:
    say: "Anything that helps you remember this repository."
